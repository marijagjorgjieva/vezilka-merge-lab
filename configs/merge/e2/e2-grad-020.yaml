# Configuration: e2-grad-020
# Recipient: finki-ukim/VezilkaLLM-Instruct
# Donor: Leoxxxxh/Gemma-3-4B-IT-TextOnly
# Method: slerp
# Default coefficient: 0.20
# Attention and MLP coefficients vary across layers as listed below.
# Recipient embeddings and tied output head are preserved.
merge_method: slerp
base_model: finki-ukim/VezilkaLLM-Instruct
models:
  - model: finki-ukim/VezilkaLLM-Instruct
  - model: Leoxxxxh/Gemma-3-4B-IT-TextOnly
parameters:
  t:
    - filter: embed_tokens
      value: 0.0
    - filter: lm_head  # No-op on tied-embedding Gemma 3; kept for portability.
      value: 0.0
    - filter: self_attn
      value: [0.05, 0.10, 0.15, 0.20, 0.25]
    - filter: mlp
      value: [0.10, 0.15, 0.20, 0.25, 0.30]
    - value: 0.20
tokenizer_source: base
chat_template: auto
dtype: bfloat16
