# Configuration: e1-slerp-005
# Recipient: finki-ukim/VezilkaLLM
# Donor: Leoxxxxh/Gemma-3-4B-IT-TextOnly
# Method: slerp
# Default coefficient: 0.05
# Recipient embeddings and tied output head are preserved.
merge_method: slerp
base_model: finki-ukim/VezilkaLLM
models:
  - model: finki-ukim/VezilkaLLM
  - model: Leoxxxxh/Gemma-3-4B-IT-TextOnly
parameters:
  t:
    - filter: embed_tokens
      value: 0.0
    - filter: lm_head  # No-op on tied-embedding Gemma 3; kept for portability.
      value: 0.0
    - value: 0.05
tokenizer_source: base
chat_template: auto
dtype: bfloat16
